<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Quicksand", "Nunito", ui-rounded, system-ui, sans-serif; }
    a { color: #a94e02; } a:hover { color: #7d3b08; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff8f0; color: #2a1f1a; font-family: 'Quicksand', 'Nunito', ui-rounded, system-ui, sans-serif;">

  <!-- Header -->
  <div style="position: relative; z-index: 3; background: #fff8f0; border-bottom: 2px solid #ffe9c7;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 0;">
      <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: -0.01em; color: #a94e02;">Ouistiti</p>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="height: 48px; display: inline-flex; align-items: center; border-radius: 999px; border: 2px solid #ffd393; background: #ffffff; color: #6b5b51; padding: 0 12px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;">English</span>
        <span style="height: 48px; display: inline-flex; align-items: center; gap: 2px; border-radius: 999px; background: #f2820d; color: #ffffff; padding: 0 16px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Ajouter
        </span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; padding: 10px 12px; overflow: hidden;">
      <span style="flex-shrink: 0; height: 48px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 2px solid #ffd393; background: #ffffff; color: #6b5b51; padding: 0 16px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#2e86c1" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Z"/><path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
        Bébés
      </span>
      <span style="flex-shrink: 0; height: 48px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 2px solid #ffd393; background: #ffffff; color: #6b5b51; padding: 0 16px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#f2820d" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 20 19H4Z"/></svg>
        Petits
      </span>
      <span style="flex-shrink: 0; height: 48px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 2px solid #ffd393; background: #ffffff; color: #6b5b51; padding: 0 16px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#2fa36b" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12Z"/></svg>
        Grands
      </span>
    </div>
  </div>

  <!-- Map. Tiles are stylised: OpenStreetMap can't be reached from a canvas. -->
  <div style="position: absolute; top: 126px; left: 0; right: 0; bottom: 0; background: #e9e0d3; overflow: hidden;">
    <svg viewBox="0 0 390 700" width="390" height="700" aria-hidden="true" style="display: block;">
      <rect width="390" height="700" fill="#e9e0d3"/>
      <path d="M-10 120 H400 M-10 330 H400 M-10 520 H400 M70 -10 V710 M210 -10 V710 M320 -10 V710" stroke="#dccfbd" stroke-width="9" fill="none"/>
      <path d="M-10 210 H400 M140 -10 V710 M270 -10 V710" stroke="#e3d8c8" stroke-width="5" fill="none"/>
      <path d="M0 470 Q120 440 210 480 T390 450 L390 700 L0 700 Z" fill="#dbe6e4"/>
      <rect x="230" y="140" width="80" height="55" rx="8" fill="#dfe8d8"/>
      <rect x="30" y="360" width="70" height="50" rx="8" fill="#dfe8d8"/>
    </svg>

    <span style="position: absolute; top: 12px; right: 12px; height: 48px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 2px solid #ffd393; background: #ffffff; color: #2a1f1a; padding: 0 14px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; box-shadow: 0 3px 10px rgba(42,31,26,.18);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
      Près de moi
    </span>

    <span style="position: absolute; top: 96px; left: 68px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; background: #f2820d; border: 3px solid #ffffff; box-shadow: 0 2px 6px rgba(42,31,26,.35); color: #ffffff;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 20 19H4Z"/></svg>
    </span>
    <span style="position: absolute; top: 150px; left: 244px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; background: #2e86c1; border: 3px solid #2a1f1a; box-shadow: 0 2px 6px rgba(42,31,26,.35); color: #ffffff;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Z"/><path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
    </span>
    <span style="position: absolute; top: 224px; left: 132px; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: #a94e02; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(42,31,26,.4); color: #ffffff; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;">4</span>
    <span style="position: absolute; top: 268px; left: 296px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; background: #2fa36b; border: 3px solid #2a1f1a; box-shadow: 0 2px 6px rgba(42,31,26,.35); color: #ffffff;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12Z"/></svg>
    </span>
    <span style="position: absolute; top: 316px; left: 52px; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background: #a94e02; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(42,31,26,.4); color: #ffffff; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;">2</span>
  </div>

  <!-- Sheet, at peek -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 42%; z-index: 4; border-top: 2px solid #ffd393; border-top-left-radius: 28px; border-top-right-radius: 28px; background: #fff8f0; box-shadow: 0 -6px 24px rgba(42,31,26,.14); overflow: hidden;">
    <div style="display: flex; justify-content: center; padding-top: 8px;">
      <span style="display: block; width: 48px; height: 6px; border-radius: 999px; background: #ffb75a;"></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 6px;">
      <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800;">23 sorties</p>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #6b5b51;">
          <span style="display: grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; background: #2e86c1; color: #fff;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Z"/><path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg></span>
          Bébés
        </span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #6b5b51;">
          <span style="display: grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; background: #f2820d; color: #fff;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 20 19H4Z"/></svg></span>
          Petits
        </span>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #6b5b51;">
          <span style="display: grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; background: #2fa36b; color: #fff;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12Z"/></svg></span>
          Grands
        </span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 4px 12px;">

      <div style="border-radius: 24px; border: 2px solid #ffe9c7; background: #ffffff; padding: 12px; box-shadow: 0 2px 0 0 #ffe9c7;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="min-width: 0; flex: 1;">
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #a94e02;">Aujourd'hui · 10:00</p>
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">L'heure du conte</p>
            <p style="margin: 0; font-size: 14px; color: #6b5b51; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Bibliothèque municipale de Chauderon</p>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
            <span style="display: inline-flex; align-items: center; gap: 4px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; color: #196644;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
              22°
            </span>
            <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; border: 2px solid #431c39; background: #6b2d5c; color: #ffffff; padding: 2px 8px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9Z"/></svg>
              Officiel
            </span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px;">
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #f2820d; color: #ffffff; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 20 19H4Z"/></svg></span>
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #2fa36b; color: #ffffff; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12Z"/></svg></span>
          <span style="font-size: 12px; font-weight: 700; color: #6b5b51;">1,5–4 ans</span>
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #fdeedd; color: #6b5b51; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg></span>
          <span style="border-radius: 999px; background: #ffe9c7; color: #7d3b08; padding: 2px 8px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;">Gratuit</span>
        </div>
      </div>

      <div style="border-radius: 24px; border: 2px solid #ffe9c7; background: #ffffff; padding: 12px; box-shadow: 0 2px 0 0 #ffe9c7;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
          <div style="min-width: 0; flex: 1;">
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #a94e02;">Toujours ouvert</p>
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Vallée de la Jeunesse</p>
            <p style="margin: 0; font-size: 14px; color: #6b5b51; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Vallée de la Jeunesse 1</p>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
            <span style="display: inline-flex; align-items: center; gap: 4px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; color: #6b2d5c;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h9.5a3.5 3.5 0 0 0 .3-7 5.5 5.5 0 0 0-10.5 1A3.5 3.5 0 0 0 7 18Z"/><path d="M9 20v2M13 20v2M17 20v2"/></svg>
              9°
            </span>
            <span style="display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; border: 2px solid #2fa36b; background: #d3f2e0; color: #196644; padding: 2px 8px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>
              Confirmé
            </span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px;">
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #2e86c1; color: #ffffff; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Z"/><path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg></span>
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #f2820d; color: #ffffff; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 20 19H4Z"/></svg></span>
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #2fa36b; color: #ffffff; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 12 12 20.5 3.5 12Z"/></svg></span>
          <span style="font-size: 12px; font-weight: 700; color: #6b5b51;">0–5 ans</span>
          <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #fdeedd; color: #6b5b51; padding: 2px 8px;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 7 11h10Z"/><path d="M12 9.5 5 19h14Z"/><path d="M12 19v2.5"/></svg></span>
          <span style="border-radius: 999px; background: #ffe9c7; color: #7d3b08; padding: 2px 8px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;">Gratuit</span>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
